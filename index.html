<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大仁哥優質生活嚴選 - 專屬購物問卷 | 2026 運勢與消費性格分析</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="嗨！我是大仁哥 👋歡迎來到大仁哥優質生活嚴選！讓我為您測出運勢與消費性格分析吧！">

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] },
                    colors: { brand: { 50: '#f5f3ff', 100: '#ede9fe', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' } },
                    animation: { 'fade-in': 'fadeIn 0.5s ease-out', 'shake': 'shake 0.5s both' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        shake: { '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' }, '20%, 80%': { transform: 'translate3d(2px, 0, 0)' }, '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' }, '40%, 60%': { transform: 'translate3d(4px, 0, 0)' } }
                    }
                }
            }
        }
    </script>

    <style>
        body { -ms-overflow-style: none; scrollbar-width: none; background-color: #f8fafc; overflow-x: hidden; }
        body::-webkit-scrollbar { display: none; }
        html { scroll-behavior: smooth; }
        .option-input { position: absolute; opacity: 0; width: 0; height: 0; }
        .option-input:checked+.option-card { border-color: #7c3aed; border-width: 2px; background-color: #f5f3ff; color: #6d28d9; transform: scale(1.02); }
        .step-content { display: none; }
        .step-content.active { display: block; animation: fadeIn 0.5s ease-out; }
        #progress-bar { transition: width 0.5s ease-in-out; }
        .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 70; }
        .border-error { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
    </style>
</head>

<body class="text-gray-700 h-screen flex flex-col">
    <div id="toast-container"></div>

    <!-- Header -->
    <div class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-4 py-3">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-brand-600 tracking-wider">大仁哥優質生活嚴選</span>
                <div class="flex items-center gap-3">
                    <span class="text-xs font-medium text-gray-400" id="step-indicator">Step 1/7</span>
                    <div class="flex items-center gap-1">
                        <svg width="24" height="24" class="transform -rotate-90">
                            <circle cx="12" cy="12" r="10" stroke="#e5e7eb" stroke-width="2" fill="none" />
                            <circle id="completion-circle" cx="12" cy="12" r="10" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="62.83" stroke-dashoffset="62.83" style="transition: stroke-dashoffset 0.5s;"/>
                        </svg>
                        <span id="completion-text" class="text-xs font-bold text-brand-600">0%</span>
                    </div>
                </div>
            </div>
            <div class="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-brand-600 rounded-full" style="width: 14%"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto pb-24" id="main-scroll">
        <div class="max-w-xl mx-auto px-4 py-6">
            <script>var submitted = false;</script>
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){showSuccessModal();}"></iframe>

            <form id="surveyForm" action="https://docs.google.com/forms/d/e/1FAIpQLSf1UJwYVJxhiDdPFS-EkXAIkBb-8_nVTnqTp7tlJvI7yhGflw/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;">
                
                <!-- STEP 1 -->
                <div id="step1" class="step-content active">
                    <div class="flex flex-col items-center mb-8 relative">
                        <div class="w-32 h-32 rounded-full border-4 border-white shadow-xl overflow-hidden mb-4 bg-brand-100">
                            <img src="https://lh3.googleusercontent.com/d/15Yy3j8CewSBciaLxyjN7x6S1yaUZw0aM=w1000" class="w-full h-full object-cover">
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-md border text-center w-full">
                            <h2 class="text-xl font-bold text-brand-700 mb-1">嗨！我是大仁哥👋</h2>
                            <p class="text-gray-600 text-sm">歡迎來到行動商城！幫您測出 <span class="text-brand-600 font-bold">2026 流年運勢</span></p>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border">
                        <p class="text-lg font-bold text-brand-700 mb-6 text-center">當您第一次走進一家店，最吸引您的是？</p>
                        <div class="space-y-3">
                            <label class="cursor-pointer block"><input type="radio" name="psyChoice" value="visual" class="option-input" onchange="storePsyResult('visual')"><div class="option-card p-4 rounded-xl border flex items-center gap-4">店內的燈光、裝潢與擺設</div></label>
                            <label class="cursor-pointer block"><input type="radio" name="psyChoice" value="auditory" class="option-input" onchange="storePsyResult('auditory')"><div class="option-card p-4 rounded-xl border flex items-center gap-4">店內播放的音樂或人聲</div></label>
                            <label class="cursor-pointer block"><input type="radio" name="psyChoice" value="olfactory" class="option-input" onchange="storePsyResult('olfactory')"><div class="option-card p-4 rounded-xl border flex items-center gap-4">店內散發的香氛或氣味</div></label>
                            <label class="cursor-pointer block"><input type="radio" name="psyChoice" value="price" class="option-input" onchange="storePsyResult('price')"><div class="option-card p-4 rounded-xl border flex items-center gap-4">商品的價格標籤或優惠訊息</div></label>
                        </div>
                    </div>
                </div>

                <!-- STEP 2 -->
                <div id="step2" class="step-content">
                    <h3 class="text-2xl font-bold text-brand-700 mb-6 border-l-4 border-brand-500 pl-3">基本資料</h3>
                    <div class="space-y-6 bg-white p-6 rounded-2xl shadow-sm border">
                        <div>
                            <label class="block text-lg font-bold mb-2">您的名字 / Line 暱稱 *</label>
                            <input type="text" name="entry.1947362638" id="input-name" class="w-full px-4 py-3 rounded-xl border-2 bg-gray-50 outline-none" placeholder="例：大仁哥" required>
                        </div>
                        <div>
                            <label class="block text-lg font-bold mb-2">您的出生月日 (例如 0520) *</label>
                            <input type="tel" id="birth-mmdd" maxlength="4" class="w-full px-4 py-3 rounded-xl border-2 bg-gray-50 text-center text-2xl font-mono" oninput="handleMMDDInput(this)">
                            <input type="hidden" name="entry.1637822650" id="input-birthday">
                        </div>
                    </div>
                </div>

                <!-- STEP 3 (Lifestyle) -->
                <div id="step3" class="step-content">
                    <h3 class="text-2xl font-bold text-brand-700 mb-6 border-l-4 border-brand-500 pl-3">您的生活風格</h3>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-8">
                        <div>
                            <p class="font-bold mb-4">平常都在哪裡購物？ (複選) *</p>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="cursor-pointer"><input type="checkbox" name="entry.1921616399" value="網購" class="option-input"><div class="option-card p-4 rounded-xl border text-center">網購</div></label>
                                <label class="cursor-pointer"><input type="checkbox" name="entry.1921616399" value="超市" class="option-input"><div class="option-card p-4 rounded-xl border text-center">超市</div></label>
                            </div>
                        </div>
                        <!-- 此處可依此類推加入其他 Step 3 的問題 -->
                    </div>
                </div>

                <!-- STEP 4 ~ 7 結構以此類推... 為了簡潔這裡先確保導覽功能正常 -->
                <!-- 請在此處保留您原有的 STEP 4 到 STEP 7 的表單欄位 -->
                <div id="step4" class="step-content"><h3 class="text-xl font-bold p-10 text-center">健康目標區塊 (請保留原 HTML)</h3></div>
                <div id="step5" class="step-content">
                    <input type="hidden" name="entry.183142830" id="hidden-decision-style">
                    <h3 class="text-xl font-bold p-10 text-center">消費決策區塊 (請保留原 HTML)</h3>
                </div>
                <div id="step6" class="step-content"><h3 class="text-xl font-bold p-10 text-center">美麗保養區塊 (請保留原 HTML)</h3></div>
                <div id="step7" class="step-content"><h3 class="text-xl font-bold p-10 text-center">最後想法區塊 (請保留原 HTML)</h3></div>

            </form>
        </div>
    </div>

    <!-- Navigation -->
    <div class="bg-white border-t p-4 sticky bottom-0 z-50">
        <div class="max-w-xl mx-auto flex gap-3">
            <button type="button" id="prev-btn" onclick="changeStep(-1)" class="hidden flex-1 py-3 rounded-xl border-2 font-bold active:scale-95">上一步</button>
            <button type="button" id="next-btn" onclick="changeStep(1)" class="flex-1 py-3 rounded-xl bg-brand-600 text-white font-bold shadow-lg active:scale-95">下一步</button>
            <button type="button" id="submit-btn" onclick="attemptSubmit()" class="hidden flex-1 py-3 rounded-xl bg-brand-600 text-white font-bold shadow-lg active:scale-95">查看測驗結果</button>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="successModal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative bg-white rounded-3xl max-w-sm w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-brand-600 p-5 text-white">
                <h3 class="text-xl font-bold">分析完成！</h3>
            </div>
            <div class="p-6 overflow-y-auto" id="result-body">
                <div id="result-psy" class="bg-brand-50 p-4 rounded-xl mb-4"></div>
                <div id="zodiac-info" class="bg-yellow-50 p-4 rounded-xl"></div>
            </div>
            <div class="p-4 border-t"><button onclick="closeModal()" class="w-full py-3 bg-gray-900 text-white font-bold rounded-xl">關閉視窗</button></div>
        </div>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 7;
        let userPsyChoice = '';
        let userDecisionStyle = '';
        let isSubmitting = false;

        function storePsyResult(value) {
            userPsyChoice = value;
            updateCompletion();
        }

        function storeDecisionStyle(value) {
            userDecisionStyle = value;
            const hiddenInput = document.getElementById('hidden-decision-style');
            if(hiddenInput) hiddenInput.value = value;
        }

        function changeStep(direction) {
            if (direction === 1 && !validateStep(currentStep)) return;

            currentStep += direction;
            if (currentStep < 1) currentStep = 1;
            if (currentStep > totalSteps) currentStep = totalSteps;

            updateUI();
        }

        function validateStep(step) {
            if (step === 1) {
                if (!userPsyChoice) {
                    showToast('請先選擇一個答案', 'warning');
                    return false;
                }
            }
            if (step === 2) {
                const name = document.getElementById('input-name').value;
                const mmdd = document.getElementById('birth-mmdd').value;
                if (!name.trim()) { showToast('請輸入名字', 'error'); return false; }
                if (mmdd.length !== 4) { showToast('請輸入4位生日', 'error'); return false; }
            }
            return true;
        }

        function updateUI() {
            document.querySelectorAll('.step-content').forEach((el, i) => {
                el.classList.toggle('active', i + 1 === currentStep);
            });

            const progress = (currentStep / totalSteps) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('step-indicator').textContent = `Step ${currentStep}/${totalSteps}`;

            document.getElementById('prev-btn').classList.toggle('hidden', currentStep === 1);
            document.getElementById('next-btn').classList.toggle('hidden', currentStep === totalSteps);
            document.getElementById('submit-btn').classList.toggle('hidden', currentStep !== totalSteps);
            
            document.getElementById('main-scroll').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleMMDDInput(el) {
            let val = el.value.replace(/\D/g, '');
            el.value = val;
            if (val.length === 4) {
                document.getElementById('input-birthday').value = `2000-${val.substring(0,2)}-${val.substring(2,4)}`;
            }
            updateCompletion();
        }

        function updateCompletion() {
            // 簡易計算：Step1 選了給 15%，Step2 填了給 15%，以此類推
            let count = 0;
            if(userPsyChoice) count += 14;
            if(document.getElementById('input-name').value) count += 14;
            
            document.getElementById('completion-text').textContent = `${count}%`;
            const circle = document.getElementById('completion-circle');
            const circumference = 62.83;
            circle.style.strokeDashoffset = circumference - (count/100) * circumference;
        }

        function showToast(msg, type='info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast bg-gray-800 text-white px-6 py-3 rounded-full shadow-xl animate-slide-up`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function attemptSubmit() {
            if(isSubmitting) return;
            isSubmitting = true;
            document.getElementById('submit-btn').innerHTML = "分析中...";
            
            // 產生分析結果文字
            document.getElementById('result-psy').textContent = "分析結果：" + userPsyChoice;
            
            const form = document.getElementById('surveyForm');
            form.submit(); // 透過 iframe 提交
        }

        function showSuccessModal() {
            document.getElementById('successModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('successModal').classList.add('hidden');
            location.reload(); // 結束後重整
        }
    </script>
</body>
</html>
